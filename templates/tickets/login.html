{% extends 'base.html' %}

{% block content %}
<!-- Container principal centralizado do formulário de login -->
<div class="max-w-md mx-auto mt-12 bg-slate-800/50 border border-slate-700/50 p-8 rounded-2xl shadow-xl">
    <h2 class="text-2xl font-bold text-white mb-6 text-center">Entrar no DeskFlow</h2>
    
    <!-- Exibe mensagem de erro caso as credenciais estejam incorretas -->
    {% if error %}
    <div class="bg-red-500/10 border border-red-500/20 text-red-400 text-xs p-3 rounded-lg mb-4">{{ error }}</div>
    {% endif %}

    <!-- Formulário de autenticação -->
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <!-- Campo para nome de usuário -->
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Usuário</label>
            <input type="text" name="username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <!-- Campo para senha -->
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Senha</label>
            <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <!-- Botão de submissão do login -->
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg text-sm transition">Entrar</button>
    </form>
    
    <!-- Link para a página de cadastro caso não possua conta -->
    <p class="text-xs text-slate-400 text-center mt-6">Não tem uma conta? <a href="{% url 'register' %}" class="text-indigo-400 hover:underline">Cadastre-se</a></p>
</div>
{% endblock %}
