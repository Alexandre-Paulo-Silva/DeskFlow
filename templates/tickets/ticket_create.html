{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <!-- Cabeçalho do formulário com botão de navegação para voltar à lista de chamados -->
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-white">Novo Chamado</h1>
        <a href="{% url 'ticket_list' %}" class="text-sm text-slate-400 hover:text-white">&larr; Voltar</a>
    </div>

    <!-- Formulário de abertura de chamado com suporte a upload de arquivos (multipart/form-data) -->
    <form method="POST" enctype="multipart/form-data" class="bg-slate-800/50 border border-slate-700/50 p-6 rounded-xl space-y-4">
        {% csrf_token %}
        
        <!-- Campo para o título resumido do problema -->
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Título do Chamado</label>
            <input type="text" name="titulo" required placeholder="Ex: Impressora sem conectar na rede"
                   class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
        </div>

        <!-- Grade com metadados do chamado: Solicitante, Categoria e Prioridade -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Nome do solicitante -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Solicitante</label>
                <input type="text" name="solicitante" required placeholder="Seu Nome"
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>

            <!-- Categoria do problema -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Categoria</label>
                <select name="categoria" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    <option value="TI">Suporte T.I.</option>
                    <option value="FINANCEIRO">Financeiro</option>
                    <option value="RH">Recursos Humanos</option>
                    <option value="INFRA">Infraestrutura</option>
                    <option value="HARDWARE">Hardware</option>
                    <option value="SOFTWARE">Software</option>
                    <option value="REDE">Rede / Internet</option>
                    <option value="OUTROS">Outros</option>
                </select>
            </div>

            <!-- Nível de prioridade do chamado -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Prioridade</label>
                <select name="prioridade" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    <option value="BAIXA">Baixa</option>
                    <option value="MEDIA" selected>Média</option>
                    <option value="ALTA">Alta</option>
                    <option value="CRITICA">Crítica</option>
                </select>
            </div>
        </div>

        <!-- Campo de texto amplo para explicação detalhada da solicitação -->
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Descrição Detalhada</label>
            <textarea name="descricao" rows="5" required placeholder="Descreva o problema com o máximo de detalhes possível..."
                      class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <!-- Campo para anexo opcional de imagem ou print de tela do erro -->
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Anexar Imagem / Print (Opcional)</label>
            <input type="file" name="anexo" accept="image/*"
                   class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
        </div>

        <!-- Botão para enviar o formulário e criar o chamado no banco NoSQL -->
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg text-sm transition shadow-lg shadow-indigo-600/20">
            Abrir Chamado
        </button>
    </form>
</div>
{% endblock %}
