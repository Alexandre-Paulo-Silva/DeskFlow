{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <!-- Cabeçalho da página com botão para voltar ao Dashboard -->
    <div>
        <a href="{% url 'admin_dashboard' %}" class="text-xs text-indigo-400 hover:underline">&larr; Voltar para o Dashboard</a>
        <h1 class="text-2xl font-bold text-white mt-1">Central de Relatórios em PDF</h1>
        <p class="text-xs text-slate-400 mt-1">Selecione o modelo de relatório e aplique os filtros desejados para exportar os dados.</p>
    </div>

    <!-- Formulário de seleção de filtros para a geração do PDF -->
    <form method="POST" class="bg-slate-800/50 border border-slate-700/50 p-6 rounded-2xl space-y-4 shadow-xl">
        {% csrf_token %}
        
        <!-- Seleção do tipo de relatório gerencial -->
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Tipo de Relatório</label>
            <select name="tipo_relatorio" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                <option value="geral_chamados">Relatório Geral de Chamados</option>
                <option value="desempenho_tecnico">Relatório Analítico por Status/Categoria</option>
            </select>
        </div>

        <!-- Grade de filtros adicionais -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Filtro por status do chamado -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Filtrar por Status</label>
                <select name="status_filtro" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <option value="">Todos os Status</option>
                    <option value="ABERTO">Aberto</option>
                    <option value="EM_ANDAMENTO">Em Andamento</option>
                    <option value="RESOLVIDO">Resolvido</option>
                    <option value="FECHADO">Fechado</option>
                </select>
            </div>

            <!-- Filtro por categoria do chamado -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Filtrar por Categoria</label>
                <select name="categoria_filtro" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <option value="">Todas as Categorias</option>
                    <option value="HARDWARE">Hardware</option>
                    <option value="SOFTWARE">Software</option>
                    <option value="REDE">Rede / Internet</option>
                    <option value="INFRA">Infraestrutura</option>
                    <option value="FINANCEIRO">Financeiro</option>
                    <option value="OUTROS">Outros</option>
                </select>
            </div>
        </div>

        <!-- Botão de submissão para gerar e baixar o documento PDF -->
        <div class="pt-4">
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg text-sm transition flex items-center justify-center gap-2">
                <i class="ph-bold ph-file-pdf text-lg"></i> Gerar e Baixar PDF
            </button>
        </div>
    </form>
</div>
{% endblock %}
