{% extends 'base.html' %}
{% block content %}
<!-- Container principal centralizado do formulário de cadastro -->
<div class="max-w-md mx-auto mt-12 bg-slate-800/50 border border-slate-700/50 p-8 rounded-2xl shadow-xl">
    <h2 class="text-2xl font-bold text-white mb-6 text-center">Criar Conta</h2>
    
    <!-- Exibe mensagem de erro (ex: usuário existente ou com espaços) -->
    {% if error %}
    <div class="bg-red-500/10 border border-red-500/20 text-red-400 text-xs p-3 rounded-lg mb-4">{{ error }}</div>
    {% endif %}

    <!-- Formulário de cadastro de usuário -->
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        
        <!-- Campo para Nome de Usuário (com remoção automática de espaços via JS no input) -->
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Nome de Usuário</label>
            <input type="text" name="username" required placeholder="ex: alexandre.silva"
                   oninput="this.value = this.value.replace(/\s/g, '')"
                   class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
            <span class="text-[10px] text-slate-500 mt-1 block">Espaços serão removidos automaticamente.</span>
        </div>

        <!-- Campo para Nome da Empresa -->
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Nome da Empresa</label>
            <input type="text" name="empresa" required placeholder="ex: Tech Solutions Ltda"
                   class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>

        <!-- Campo para E-mail -->
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">E-mail</label>
            <input type="email" name="email" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>

        <!-- Campo para Senha -->
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Senha</label>
            <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>

        <!-- Seleção do perfil/tipo de conta no sistema -->
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Tipo de Conta</label>
            <select name="tipo" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                <option value="cliente">Cliente (Abre chamados)</option>
                <option value="tecnico">Técnico / Suporte (Atende chamados)</option>
                <option value="admin">Administrador (Gestão completa e Dashboard)</option>
            </select>
        </div>

        <!-- Botão de submissão do formulário -->
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg text-sm transition">Registrar</button>
    </form>

    <!-- Link para a página de login se o usuário já possuir conta -->
    <p class="text-xs text-slate-400 text-center mt-6">Já tem uma conta? <a href="{% url 'login' %}" class="text-indigo-400 hover:underline">Faça login</a></p>
</div>
{% endblock %}
